<!DOCTYPE html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Reliquary — excavate valuable fragments from old drafts" />
    <meta name="theme-color" content="#1a1814" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Reliquary" />
    <title>Reliquary</title>
    <link rel="manifest" href="./manifest.webmanifest" />
    <!-- System fonts first (offline / privacy). Optional webfonts load if online. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,600;0,7..72,700;1,7..72,400&family=Source+Sans+3:wght@400;500;600&display=swap"
      rel="stylesheet"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        href="https://fonts.googleapis.com/css2?family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,600&family=Source+Sans+3:wght@400;600&display=swap"
        rel="stylesheet"
      />
    </noscript>
    <link rel="stylesheet" href="./src/styles.css" />
    <link rel="icon" href="./public/icon-192.png" type="image/png" />
    <link rel="icon" href="./public/reliquary-mark.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./public/apple-touch-icon.png" />
  </head>
  <body>
    <div id="app" class="app">
      <div class="boot">
        <img class="boot-logo" src="./public/reliquary-mark.png" alt="Reliquary — otter vault" width="120" height="120" />
        <p class="boot-mark">Reliquary</p>
        <p class="muted">Opening your vault…</p>
        <p class="dim" style="font-size:0.85rem;margin-top:0.5rem">If this never finishes, close other Reliquary tabs and press Cmd+Shift+R</p>
      </div>
    </div>
    <script>
      setTimeout(function () {
        var app = document.getElementById('app');
        if (!app) return;
        var boot = app.querySelector('.boot');
        if (!boot || !/Opening your vault/.test(boot.textContent || '')) return;
        var p = document.createElement('p');
        p.className = 'dim';
        p.style.cssText = 'max-width:28rem;margin:1rem auto 0;font-size:0.85rem;line-height:1.5';
        p.innerHTML =
          'Still opening. Use <strong>http://127.0.0.1:8780</strong> (run <code>./start.sh</code>), close other Reliquary tabs, then press Cmd+Shift+R.';
        boot.appendChild(p);
      }, 5000);
    </script>
    <script type="module" src="./src/main.js?v=12"></script>
  </body>
</html>
