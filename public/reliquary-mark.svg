<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Reliquary">
  <!-- Monogram: zoomed otter crest + vault lid — readable at 32px -->
  <rect width="64" height="64" rx="14" fill="#161310"/>
  <rect x="1.5" y="1.5" width="61" height="61" rx="12.5" fill="none" stroke="#3a342c" stroke-width="1.5"/>

  <!-- simplified open lid arc (background) -->
  <path fill="#8b5a32" d="M10 34c0-12 9-20 22-20s22 8 22 20H10z"/>
  <path fill="#5a2428" d="M14 34c0-9 7-15 18-15s18 6 18 15H14z"/>
  <path fill="none" stroke="#d4a84a" stroke-width="2" d="M10 34c0-12 9-20 22-20s22 8 22 20"/>

  <!-- gold glow coins -->
  <ellipse cx="32" cy="30" rx="12" ry="5" fill="#f0d070" opacity="0.85"/>
  <circle cx="26" cy="29" r="2.5" fill="#e8c060"/>
  <circle cx="32" cy="28" r="3" fill="#f5e090"/>
  <circle cx="38" cy="29.5" r="2.3" fill="#d4a84a"/>

  <!-- BIG otter crest (hero of monogram) -->
  <ellipse cx="32" cy="46" rx="16" ry="10" fill="#6b4630"/>
  <ellipse cx="34" cy="47" rx="7" ry="5.5" fill="#e8d4b8"/>
  <!-- head -->
  <circle cx="42" cy="42" r="7.5" fill="#7a5238"/>
  <ellipse cx="43.5" cy="43" rx="4.5" ry="4" fill="#e8d4b8"/>
  <ellipse cx="46" cy="44" rx="2.4" ry="1.8" fill="#f0e0c8"/>
  <circle cx="47" cy="43.8" r="0.9" fill="#1a1410"/>
  <!-- eyes -->
  <circle cx="40.5" cy="41" r="1.6" fill="#1a1410"/>
  <circle cx="44.2" cy="41" r="1.6" fill="#1a1410"/>
  <circle cx="41" cy="40.6" r="0.55" fill="#fff8e8"/>
  <circle cx="44.7" cy="40.6" r="0.55" fill="#fff8e8"/>
  <path d="M42.5 45.5c1 0.9 2.8 0.9 3.8 0" fill="none" stroke="#5a3820" stroke-width="1" stroke-linecap="round"/>
  <!-- tail -->
  <path d="M16 46c-3-3-2-8 2-9 2.5-.5 3.5 2 2 3.5-2 2-1.5 5 1 6" fill="none" stroke="#6b4630" stroke-width="3.5" stroke-linecap="round"/>
  <!-- spark -->
  <circle cx="50" cy="20" r="1.6" fill="#f5e090"/>
</svg>
